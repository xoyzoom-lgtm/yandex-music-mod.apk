name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Версия релиза без «v», например 0.1.0. Пусто — обычная сборка без релиза."
        required: false
        default: ""

permissions:
  contents: read

env:
  # Application ID приложения в Discord Developer Portal (Settings → Variables → Actions).
  DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Discord Social SDK
        env:
          DISCORD_SDK_AAR_URL: ${{ secrets.DISCORD_SDK_AAR_URL }}
        run: .github/scripts/fetch-discord-sdk.sh

      - name: Unit-тесты и lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Компиляция release-варианта
        run: ./gradlew --no-daemon compileReleaseKotlin

      - uses: actions/upload-artifact@v4
        with:
          name: ymmod-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/

  release:
    name: Релиз
    # Релиз — по пушу тега vX.Y.Z или ручным запуском с указанной версией (тег создастся сам).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Discord Social SDK
        env:
          DISCORD_SDK_AAR_URL: ${{ secrets.DISCORD_SDK_AAR_URL }}
        run: .github/scripts/fetch-discord-sdk.sh

      - name: Версия
        id: version
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then version="${INPUT_VERSION#v}"; else version="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Некорректная версия: $version"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Ключ подписи
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрет SIGNING_KEYSTORE_BASE64 не задан — релиз подписан временным debug-ключом, обновление поверх прошлых версий не установится."
          fi

      - name: Release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_PATH" ]; then unset SIGNING_KEYSTORE_PATH; fi
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/YmMod-${VERSION_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: YM Mod ${{ steps.version.outputs.name }}
          files: dist/*.apk
          generate_release_notes: true
